services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omniflux
      POSTGRES_USER: omniflux
      POSTGRES_PASSWORD: omniflux
    ports: ["5432:5432"]
    volumes: ["omniflux-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniflux -d omniflux"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
    volumes: ["omniflux-redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  omniflux-postgres:
  omniflux-redis:
