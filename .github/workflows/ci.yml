name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: omniflux
          POSTGRES_PASSWORD: omniflux
          POSTGRES_DB: omniflux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U omniflux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OMNIFLUX_TEST_DATABASE_URL: postgres://omniflux:omniflux@localhost:5432/omniflux_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...
      - name: go vet
        run: go vet ./...

  admin:
    name: Admin console (typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - name: install dependencies
        run: pnpm --dir web/admin install --frozen-lockfile
      - name: typecheck
        run: pnpm --dir web/admin typecheck
      - name: build
        run: pnpm --dir web/admin build