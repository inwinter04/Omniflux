name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (go test / vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./...
      - name: go vet
        run: go vet ./...

  admin:
    name: Admin console (typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/admin/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/admin/pnpm-lock.yaml
      - name: install dependencies
        run: pnpm --dir web/admin install --frozen-lockfile
      - name: typecheck
        run: pnpm --dir web/admin typecheck
      - name: build
        run: pnpm --dir web/admin build